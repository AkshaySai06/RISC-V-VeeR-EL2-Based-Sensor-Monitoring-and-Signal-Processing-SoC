<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 560" width="1150" height="560" style="background:#1e1e2e; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#313244" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#181825" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Header Bar -->
  <rect x="0" y="0" width="1150" height="55" fill="#181825"/>
  <text x="25" y="35" fill="#89b4fa" font-size="20" font-weight="bold">UART End-to-End Verification Waveform (VeeR EL2 SoC)</text>
  <text x="750" y="35" fill="#a6adc8" font-size="14">Data: 0xA5 (10100101b) | Baud: 115200 (8-N-1) | Clks/bit: 434</text>
  <line x1="0" y1="55" x2="1150" y2="55" stroke="#45475a" stroke-width="1.5"/>

  <!-- Left Sidebar (Signal Names) -->
  <rect x="0" y="55" width="230" height="505" fill="#11111b"/>
  <line x1="230" y1="55" x2="230" y2="560" stroke="#45475a" stroke-width="2"/>

  <!-- Time Header Bar -->
  <rect x="230" y="55" width="920" height="35" fill="#181825"/>
  <line x1="230" y1="90" x2="1150" y2="90" stroke="#313244" stroke-width="1"/>

  <!-- Time Axis Markers -->
  <!-- 10 intervals of ~80px each (representing 8.68 us per bit) -->
  <!-- Start x = 270, spacing = 75px -->
  <text x="250" y="78" fill="#6c7086" font-size="11">0 us</text>
  <text x="325" y="78" fill="#f38ba8" font-size="11" font-weight="bold">START (0)</text>
  <text x="400" y="78" fill="#a6e3a1" font-size="11">D0 (1)</text>
  <text x="475" y="78" fill="#a6e3a1" font-size="11">D1 (0)</text>
  <text x="550" y="78" fill="#a6e3a1" font-size="11">D2 (1)</text>
  <text x="625" y="78" fill="#a6e3a1" font-size="11">D3 (0)</text>
  <text x="700" y="78" fill="#a6e3a1" font-size="11">D4 (0)</text>
  <text x="775" y="78" fill="#a6e3a1" font-size="11">D5 (1)</text>
  <text x="850" y="78" fill="#a6e3a1" font-size="11">D6 (0)</text>
  <text x="925" y="78" fill="#a6e3a1" font-size="11">D7 (1)</text>
  <text x="1000" y="78" fill="#f9e2af" font-size="11" font-weight="bold">STOP (1)</text>
  <text x="1075" y="78" fill="#6c7086" font-size="11">IDLE</text>

  <!-- Vertical Grid Guidelines -->
  <g stroke="#313244" stroke-width="1" stroke-dasharray="3,3">
    <line x1="310" y1="90" x2="310" y2="550"/>
    <line x1="385" y1="90" x2="385" y2="550"/>
    <line x1="460" y1="90" x2="460" y2="550"/>
    <line x1="535" y1="90" x2="535" y2="550"/>
    <line x1="610" y1="90" x2="610" y2="550"/>
    <line x1="685" y1="90" x2="685" y2="550"/>
    <line x1="760" y1="90" x2="760" y2="550"/>
    <line x1="835" y1="90" x2="835" y2="550"/>
    <line x1="910" y1="90" x2="910" y2="550"/>
    <line x1="985" y1="90" x2="985" y2="550"/>
    <line x1="1060" y1="90" x2="1060" y2="550"/>
  </g>

  <!-- Midpoint Sampling Strobe Lines (Gold) -->
  <g stroke="#fab387" stroke-width="1" stroke-dasharray="1,4" opacity="0.7">
    <line x1="347" y1="90" x2="347" y2="280"/>
    <line x1="422" y1="90" x2="422" y2="280"/>
    <line x1="497" y1="90" x2="497" y2="280"/>
    <line x1="572" y1="90" x2="572" y2="280"/>
    <line x1="647" y1="90" x2="647" y2="280"/>
    <line x1="722" y1="90" x2="722" y2="280"/>
    <line x1="797" y1="90" x2="797" y2="280"/>
    <line x1="872" y1="90" x2="872" y2="280"/>
    <line x1="947" y1="90" x2="947" y2="280"/>
    <line x1="1022" y1="90" x2="1022" y2="280"/>
  </g>

  <!-- ============================================================== -->
  <!-- Signal 1: rst_n -->
  <!-- ============================================================== -->
  <text x="20" y="125" fill="#cdd6f4" font-size="13" font-weight="bold">tb_soc_uvm_top.rst_n</text>
  <polyline fill="none" stroke="#fab387" stroke-width="2.5"
            points="230,135 260,135 260,115 1150,115"/>

  <!-- ============================================================== -->
  <!-- Signal 2: uart_rx (VIP Injected Serial Frame) -->
  <!-- ============================================================== -->
  <text x="20" y="175" fill="#89dceb" font-size="13" font-weight="bold">u_uart_vip_if.uart_rx</text>
  <text x="20" y="190" fill="#6c7086" font-size="11">VIP Stimulus (8-N-1)</text>
  <!-- Frame points:
       Idle: 230->310 (High=165)
       Start (0): 310->385 (Low=195)
       D0 (1): 385->460 (High=165)
       D1 (0): 460->535 (Low=195)
       D2 (1): 535->610 (High=165)
       D3 (0): 610->685 (Low=195)
       D4 (0): 685->760 (Low=195)
       D5 (1): 760->835 (High=165)
       D6 (0): 835->910 (Low=195)
       D7 (1): 910->985 (High=165)
       Stop (1): 985->1060 (High=165)
       Idle (1): 1060->1150 (High=165)
  -->
  <polyline fill="none" stroke="#a6e3a1" stroke-width="3"
            points="230,165 310,165 310,195 385,195 385,165 460,165 460,195 535,195 535,165 610,165 610,195 760,195 760,165 835,165 835,195 910,195 910,165 1060,165 1150,165"/>
  <!-- Bit labels on waveform -->
  <text x="340" y="190" fill="#11111b" font-size="12" font-weight="bold">0</text>
  <text x="415" y="180" fill="#11111b" font-size="12" font-weight="bold">1</text>
  <text x="490" y="190" fill="#11111b" font-size="12" font-weight="bold">0</text>
  <text x="565" y="180" fill="#11111b" font-size="12" font-weight="bold">1</text>
  <text x="640" y="190" fill="#11111b" font-size="12" font-weight="bold">0</text>
  <text x="715" y="190" fill="#11111b" font-size="12" font-weight="bold">0</text>
  <text x="790" y="180" fill="#11111b" font-size="12" font-weight="bold">1</text>
  <text x="865" y="190" fill="#11111b" font-size="12" font-weight="bold">0</text>
  <text x="940" y="180" fill="#11111b" font-size="12" font-weight="bold">1</text>
  <text x="1015" y="180" fill="#11111b" font-size="12" font-weight="bold">1</text>

  <!-- ============================================================== -->
  <!-- Signal 3: Monitor Midpoint Samples -->
  <!-- ============================================================== -->
  <text x="20" y="235" fill="#f9e2af" font-size="13" font-weight="bold">uart_vip_monitor</text>
  <text x="20" y="250" fill="#6c7086" font-size="11">Midpoint Sample Pulse</text>
  <!-- Pulses at midpoints -->
  <g stroke="#f9e2af" stroke-width="2" fill="none">
    <polyline points="342,250 347,230 352,250"/>
    <polyline points="417,250 422,230 427,250"/>
    <polyline points="492,250 497,230 502,250"/>
    <polyline points="567,250 572,230 577,250"/>
    <polyline points="642,250 647,230 652,250"/>
    <polyline points="717,250 722,230 727,250"/>
    <polyline points="792,250 797,230 802,250"/>
    <polyline points="867,250 872,230 877,250"/>
    <polyline points="942,250 947,230 952,250"/>
    <polyline points="1017,250 1022,230 1027,250"/>
  </g>
  <line x1="230" y1="250" x2="1150" y2="250" stroke="#f9e2af" stroke-width="1"/>

  <!-- ============================================================== -->
  <!-- Signal 4: DUT FSM State (soc_dut.u_uart.rx_state) -->
  <!-- ============================================================== -->
  <text x="20" y="295" fill="#cba6f7" font-size="13" font-weight="bold">soc_dut.u_uart.rx_state</text>
  <text x="20" y="310" fill="#6c7086" font-size="11">Receiver FSM</text>
  <!-- Bus Boxes for States -->
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <!-- IDLE -->
    <rect x="230" y="285" width="80" height="25" fill="#313244" stroke="#cba6f7" stroke-width="1.5" rx="3"/>
    <text x="270" y="302" fill="#cdd6f4">IDLE (0)</text>
    <!-- START -->
    <rect x="310" y="285" width="75" height="25" fill="#585b70" stroke="#f38ba8" stroke-width="1.5" rx="3"/>
    <text x="347" y="302" fill="#f38ba8">START (1)</text>
    <!-- DATA (8 bits) -->
    <rect x="385" y="285" width="600" height="25" fill="#45475a" stroke="#89b4fa" stroke-width="1.5" rx="3"/>
    <text x="685" y="302" fill="#89b4fa">RX_DATA (2) — 8-bit Shift Accumulation</text>
    <!-- STOP -->
    <rect x="985" y="285" width="75" height="25" fill="#585b70" stroke="#f9e2af" stroke-width="1.5" rx="3"/>
    <text x="1022" y="302" fill="#f9e2af">STOP (3)</text>
    <!-- IDLE -->
    <rect x="1060" y="285" width="90" height="25" fill="#313244" stroke="#cba6f7" stroke-width="1.5" rx="3"/>
    <text x="1105" y="302" fill="#cdd6f4">IDLE (0)</text>
  </g>

  <!-- ============================================================== -->
  <!-- Signal 5: DUT Shift Register (soc_dut.u_uart.rx_shift_reg) -->
  <!-- ============================================================== -->
  <text x="20" y="350" fill="#b4befe" font-size="13" font-weight="bold">u_uart.rx_shift_reg[7:0]</text>
  <text x="20" y="365" fill="#6c7086" font-size="11">Accumulated Data</text>
  <g font-size="10" text-anchor="middle">
    <rect x="230" y="345" width="192" height="24" fill="#181825" stroke="#b4befe" stroke-width="1" rx="2"/>
    <text x="326" y="361" fill="#6c7086">8'h00</text>
    <rect x="422" y="345" width="75" height="24" fill="#313244" stroke="#b4befe" stroke-width="1" rx="2"/>
    <text x="459" y="361" fill="#cdd6f4">8'h01</text>
    <rect x="497" y="345" width="75" height="24" fill="#313244" stroke="#b4befe" stroke-width="1" rx="2"/>
    <text x="534" y="361" fill="#cdd6f4">8'h01</text>
    <rect x="572" y="345" width="75" height="24" fill="#313244" stroke="#b4befe" stroke-width="1" rx="2"/>
    <text x="609" y="361" fill="#cdd6f4">8'h05</text>
    <rect x="647" y="345" width="75" height="24" fill="#313244" stroke="#b4befe" stroke-width="1" rx="2"/>
    <text x="684" y="361" fill="#cdd6f4">8'h05</text>
    <rect x="722" y="345" width="75" height="24" fill="#313244" stroke="#b4befe" stroke-width="1" rx="2"/>
    <text x="759" y="361" fill="#cdd6f4">8'h05</text>
    <rect x="797" y="345" width="75" height="24" fill="#313244" stroke="#b4befe" stroke-width="1" rx="2"/>
    <text x="834" y="361" fill="#cdd6f4">8'h25</text>
    <rect x="872" y="345" width="75" height="24" fill="#313244" stroke="#b4befe" stroke-width="1" rx="2"/>
    <text x="909" y="361" fill="#cdd6f4">8'h25</text>
    <!-- Final Decoded Byte: 0xA5 -->
    <rect x="947" y="345" width="203" height="24" fill="#a6e3a1" fill-opacity="0.2" stroke="#a6e3a1" stroke-width="2" rx="2"/>
    <text x="1048" y="361" fill="#a6e3a1" font-weight="bold">8'hA5 (10100101b)</text>
  </g>

  <!-- ============================================================== -->
  <!-- Signal 6: DUT Hardware FIFO (soc_dut.u_uart.rx_fifo[0]) -->
  <!-- ============================================================== -->
  <text x="20" y="405" fill="#a6e3a1" font-size="13" font-weight="bold">u_uart.rx_fifo[0][7:0]</text>
  <text x="20" y="420" fill="#6c7086" font-size="11">Hardware FIFO Storage</text>
  <g font-size="11" text-anchor="middle">
    <rect x="230" y="400" width="825" height="25" fill="#181825" stroke="#585b70" stroke-width="1" rx="2"/>
    <text x="642" y="417" fill="#6c7086">Uninitialized (Empty FIFO)</text>
    <!-- Latched 8'hA5 at Stop Bit commit (t = 84.57 us) -->
    <rect x="1055" y="400" width="95" height="25" fill="#a6e3a1" fill-opacity="0.3" stroke="#a6e3a1" stroke-width="2.5" rx="2"/>
    <text x="1102" y="417" fill="#a6e3a1" font-weight="bold">0xA5</text>
  </g>

  <!-- ============================================================== -->
  <!-- Signal 7: DUT RX Flags & Pointers -->
  <!-- ============================================================== -->
  <text x="20" y="455" fill="#f38ba8" font-size="13" font-weight="bold">u_uart.rx_wptr[3:0]</text>
  <polyline fill="none" stroke="#f38ba8" stroke-width="2"
            points="230,470 1055,470 1055,450 1150,450"/>
  <text x="1070" y="445" fill="#f38ba8" font-size="11" font-weight="bold">wptr = 1</text>
  <text x="250" y="465" fill="#6c7086" font-size="11">wptr = 0</text>

  <text x="20" y="505" fill="#eba0ac" font-size="13" font-weight="bold">u_uart.status_frame_err</text>
  <line x1="230" y1="515" x2="1150" y2="515" stroke="#a6e3a1" stroke-width="2.5"/>
  <text x="250" y="510" fill="#a6e3a1" font-size="11" font-weight="bold">0 (No Error)</text>

  <!-- Bottom Annotation Bar -->
  <rect x="0" y="525" width="1150" height="35" fill="#181825"/>
  <text x="30" y="547" fill="#a6e3a1" font-size="13" font-weight="bold">MATCH VERIFIED: Serial Frame 8-N-1 (0xA5) -&gt; VIP Monitor (0xA5) -&gt; DUT rx_shift_reg (0xA5) -&gt; DUT rx_fifo[0] (0xA5)</text>
</svg>
